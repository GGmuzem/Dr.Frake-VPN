version: '3.9'

services:
  backend:
    build: .
    container_name: vpn-backend
    restart: always
    ports:
      - "8081:8081" # PORT в .env = 8081
    env_file:
      - .env
    volumes:
      - db_data:/app/data
    networks:
      - default
      - bot-network

  web:
    build:
      context: ../web
    container_name: fblink-web
    restart: always
    environment:
      BACKEND_API_URL: http://backend:8081
      NEXT_PUBLIC_API_BASE_URL: http://backend:8081
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - default
      - bot-network

  redis:
    image: redis:7-alpine
    container_name: vpn-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default
      - bot-network

volumes:
  db_data:
  redis_data:

networks:
  bot-network:
    external: true
    name: replitbot_bot-network
